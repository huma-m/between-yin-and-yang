<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>stage</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;          /* nothing outside the artboard is ever visible */
      }
      #rive-stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      /* Sizing mirrors the rive.to player: a block-level canvas at 100%/100% of
         a fixed, inset:0 container. No `will-change: transform` here - it
         promotes the canvas onto its own compositing layer, which is a likely
         contributor to the canvas rasterising soft before the first
         resizeDrawingSurfaceToCanvas(). The slide transition still works
         without it. */
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        transition-property: transform;
        transition-timing-function: cubic-bezier(0.16, 0.84, 0.44, 1);
        transition-duration: 1400ms;
      }
      /* Backstage waits off-screen to the left and cannot be clicked yet. */
      #back-canvas {
        transform: translateX(-100%);
        pointer-events: none;
      }
      /* Only once the slide has finished does backstage take the pointer. */
      #back-canvas.live {
        transform: translateX(0);
        pointer-events: auto;
        transition: none;
      }
      #stage-canvas.swiding { transform: translateX(100%); }

      #rive-status {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        padding: 10px 14px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6e6e6;
        background: rgba(0, 0, 0, 0.72);
      }
      #rive-status[hidden] { display: none; }
      #rive-status.error { background: rgba(120, 0, 0, 0.85); }
      #debug {
        position: fixed;
        left: 8px; top: 8px;
        z-index: 10;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9ef79e;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 9px;
        white-space: pre;
      }
      #debug[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="rive-stage">
      <canvas id="stage-canvas"></canvas>
      <canvas id="back-canvas"></canvas>
    </div>

    <div id="debug" hidden></div>

    <div id="rive-status" role="status" aria-live="polite">
      <p class="message">Loading</p>
    </div>

    <!-- Same runtime package and version specifier the rive.to player uses.
         Currently resolves to @rive-app/webgl2 2.44.2. Pin it here if you
         ever want the deployed page to be byte-reproducible. -->
    <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.x.x/rive.js"></script>

    <script>
      (function () {
        'use strict';

        // ------------------------------------------------------------------
        // Configuration
        // ------------------------------------------------------------------
        var RUNTIME_SRC = 'stage.riv';

        // 'cover' fills the viewport and crops the artboard's overflow, so
        // nothing outside the artboard is ever visible. Swap to 'contain' to
        // see the whole artboard with letterbox bars instead.
        var FIT = 'cover';
        var ALIGNMENT = 'center';

        // Same construction as the rive.to player.
        var ENABLE_GPU_CANVAS = true;
        var AUTOPLAY = true;
        var AUTO_BIND = true;
        var ENABLE_MULTI_TOUCH = true;

        var STAGE_ARTBOARD = 'Main';
        var STAGE_STATE_MACHINE = 'Game';          // Main's default state machine

        var BACK_ARTBOARD = 'backstage';
        var BACK_STATE_MACHINE = 'State Machine 1'; // backstage's default state machine

        // GameState view model property that drives the whole flow.
        var STAGE_PROPERTY = 'stage';
        var SLIDE_AT = 4;          // stage 4 == curtains closed

        var SLIDE_MS = 1400;       // must match the CSS transition-duration

        // ------------------------------------------------------------------
        // State
        // ------------------------------------------------------------------
        var riveFile = null;
        var stageRive = null;
        var backRive = null;
        var stageProperty = null;
        var sliding = false;
        var finished = false;
        var params = new URLSearchParams(window.location.search);
        var debugOn = params.has('debug');

        var stageCanvas = document.getElementById('stage-canvas');
        var backCanvas = document.getElementById('back-canvas');
        var statusEl = document.getElementById('rive-status');
        var debugEl = document.getElementById('debug');

        if (debugOn) { debugEl.hidden = false; }

        function log(msg) {
          if (!debugOn) { return; }
          debugEl.textContent += msg + '\n';
          console.log('[stage]', msg);
        }

        function showError(msg) {
          statusEl.hidden = false;
          statusEl.classList.add('error');
          statusEl.querySelector('.message').textContent = msg;
          log('ERROR: ' + msg);
        }

        function hideStatus() { statusEl.hidden = true; }

        function wait(ms) {
          return new Promise(function (resolve) { setTimeout(resolve, ms); });
        }

        // ------------------------------------------------------------------
        // Canvas sizing - now follows the rive.to player's startup order.
        //
        // hosted.js does, in this order:
        //   1. construct Rive with layout: new rive.Layout({fit, alignment})
        //   2. install a ResizeObserver on the canvas, no-op until it has loaded
        //   3. in onLoad: register the instance, then call
        //      resizeDrawingSurfaceToCanvas() as the last statement
        //   4. at boot, te() arms a devicePixelRatio matchMedia that resizes
        //      every instance and re-arms the query
        // This page was missing step 3, which is why it stayed soft until the
        // first window resize, and it had no step 2 or 4 at all.
        // ------------------------------------------------------------------
        var stageLoaded = false;
        var dprQuery = null;
        var liveInstances = [];

        // Registered from each instance's own onLoad, because at that point the
        // instance exists but the `await` that assigns it to a global has not
        // run yet.
        function registerInstance(inst) {
          if (inst && liveInstances.indexOf(inst) === -1) { liveInstances.push(inst); }
        }

        function unregisterInstance(inst) {
          var i = liveInstances.indexOf(inst);
          if (i !== -1) { liveInstances.splice(i, 1); }
        }

        function fitInstances() {
          for (var i = 0; i < liveInstances.length; i++) {
            liveInstances[i].resizeDrawingSurfaceToCanvas();
          }
        }

        // Sizing again right after load, then after the first animation frame,
        // covers the case where the container's box settles late (fonts,
        // scrollbars, first paint). Harmless if the size has not changed.
        function settleSizing() {
          fitInstances();
          requestAnimationFrame(function () {
            fitInstances();
            requestAnimationFrame(fitInstances);
          });
        }

        // te() in hosted.js: watch devicePixelRatio so a browser zoom or a move
        // to a monitor with a different scale re-sizes every instance, then
        // re-arm the query so it keeps working. Stable handler reference so the
        // old listener is actually removed.
        function onDevicePixelRatioChange() {
          fitInstances();
          armDevicePixelRatioWatcher();
        }

        function armDevicePixelRatioWatcher() {
          if (typeof window.matchMedia !== 'function') { return; }
          if (dprQuery) {
            if (dprQuery.removeEventListener) { dprQuery.removeEventListener('change', onDevicePixelRatioChange); }
            else if (dprQuery.removeListener) { dprQuery.removeListener(onDevicePixelRatioChange); }
          }
          var dpr = window.devicePixelRatio || 1;
          dprQuery = window.matchMedia(
            '(min-resolution: ' + (dpr - 0.001) + 'dppx) and (max-resolution: ' + (dpr + 0.001) + 'dppx)');
          if (dprQuery.addEventListener) { dprQuery.addEventListener('change', onDevicePixelRatioChange); }
          else if (dprQuery.addListener) { dprQuery.addListener(onDevicePixelRatioChange); }
        }

        // ------------------------------------------------------------------
        // Instance construction - mirrors hosted.js's $()/Q() options exactly
        // ------------------------------------------------------------------
        function instanceOptions(canvas, artboard, stateMachine, onLoad, onLoadError) {
          return {
            canvas: canvas,
            artboard: artboard,              // -> runtime artboardByName(name)
            stateMachine: stateMachine,      // -> runtime plays this state machine
            autoplay: AUTOPLAY,
            autoBind: AUTO_BIND,             // binds the artboard's view model instance
            enableGPUCanvas: ENABLE_GPU_CANVAS,
            enableMultiTouch: ENABLE_MULTI_TOUCH,
            layout: new rive.Layout({ fit: FIT, alignment: ALIGNMENT }),
            onLoad: onLoad,
            onLoadError: onLoadError
          };
        }

        // Prefer the already-loaded RiveFile (what the rive.to player does).
        // If the runtime ever refuses a second instance from one file, fall
        // back to letting the runtime load the source itself.
        function createInstance(opts, useSharedFile) {
          return new Promise(function (resolve, reject) {
            var config = Object.assign({}, opts);
            if (useSharedFile) { config.riveFile = riveFile; }
            else { config.src = RUNTIME_SRC; }

            var settled = false;
            var instance = null;

            // Keep the caller's onLoad/onLoadError - they are overwritten below.
            var userOnLoad = config.onLoad;
            var userOnLoadError = config.onLoadError;

            config.onLoad = function () {
              if (settled) { return; }
              settled = true;
              // Called with the instance so the caller can register it. At this
              // moment the surrounding `await` has not yet assigned it to a
              // global, so sizing must not depend on that assignment.
              if (userOnLoad) { userOnLoad(instance); }
              resolve(instance);
            };
            config.onLoadError = function (e) {
              if (settled) { return; }
              if (userOnLoadError) { userOnLoadError(e); }
              if (useSharedFile) {
                log('shared RiveFile did not produce an instance; retrying with src');
                createInstance(opts, false).then(resolve, reject);
                return;
              }
              settled = true;
              reject(e);
            };

            instance = new rive.Rive(config);
          });
        }

        // ------------------------------------------------------------------
        // Boot
        // ------------------------------------------------------------------
        async function boot() {
          try {
            log('runtime loaded; fetching ' + RUNTIME_SRC);
            riveFile = new rive.RiveFile({ src: RUNTIME_SRC, enableGPUCanvas: ENABLE_GPU_CANVAS });
            await riveFile.init();
            log('file ready, fit=' + FIT);

            stageRive = new rive.Rive(Object.assign(
              { riveFile: riveFile },
              instanceOptions(stageCanvas, STAGE_ARTBOARD, STAGE_STATE_MACHINE,
                              function () {
                                hideStatus();
                                stageLoaded = true;
                                log('stage loaded');
                                registerInstance(stageRive);
                                watchStage();
                                // hosted.js ends its onLoad with exactly this
                                // call. It is what makes the first frame sharp.
                                settleSizing();
                              },
                              function (e) { showError('Stage failed to load: ' + e); })));

            // ResizeObserver on the container. A window resize listener misses
            // container changes that are not window changes, and fired only
            // once the user happened to resize - which is what left this page
            // blurry. Observed box size ignores transforms, so the slide's
            // translateX cannot make this misfire or restart the transition.
            if (typeof ResizeObserver === 'function') {
              var ro = new ResizeObserver(function () {
                if (stageLoaded) { fitInstances(); }
              });
              ro.observe(document.getElementById('rive-stage'));
            }
            // Fallback for browsers without ResizeObserver, same as hosted.js.
            window.addEventListener('resize', fitInstances);
            window.addEventListener('load', settleSizing);
            armDevicePixelRatioWatcher();

            if (params.has('test')) {
              log('?test - sliding in 1s');
              setTimeout(runSlide, 1000);
            }
          } catch (err) {
            showError('Could not load ' + RUNTIME_SRC + ' (' + err + ')');
          }
        }

        // ------------------------------------------------------------------
        // Watch the stage view model property
        //
        // Read once per animation frame rather than subscribing to change
        // events: it is one property read, and it avoids depending on the
        // property-level event API.
        // ------------------------------------------------------------------
        function watchStage() {
          var vmi = stageRive && stageRive.viewModelInstance;
          if (!vmi) { log('no viewModelInstance on the stage'); return; }
          stageProperty = vmi.number(STAGE_PROPERTY);
          if (!stageProperty) {
            log('view model property "' + STAGE_PROPERTY + '" not found');
            return;
          }
          log('watching "' + STAGE_PROPERTY + '" (currently ' + stageProperty.value + ')');
          tick();

          function tick() {
            if (sliding || finished || !stageProperty) { return; }
            var v = stageProperty.value;
            if (debugOn && Math.floor(v) !== tick.last) {
              tick.last = Math.floor(v);
              debugEl.textContent = 'stage = ' + v;
            }
            if (v >= SLIDE_AT) {
              log('stage reached ' + v + ' -> slide');
              runSlide();
              return;
            }
            requestAnimationFrame(tick);
          }
        }

        // ------------------------------------------------------------------
        // The slide
        // ------------------------------------------------------------------
        async function runSlide() {
          if (sliding || finished) { return; }
          sliding = true;
          stopWatching();
          log('slide: loading backstage');

          try {
            // Backstage is its own artboard with its own state machine and its
            // own view model, so its door listeners get real pointer input.
            backRive = await createInstance(instanceOptions(
              backCanvas, BACK_ARTBOARD, BACK_STATE_MACHINE,
              function (inst) {
                log('backstage loaded');
                registerInstance(inst);
                // Size backstage BEFORE the transition starts. Its canvas is
                // still translated off-screen here; transforms do not affect
                // the measured content box, so this does not disturb the slide
                // and the slide does not disturb the sizing.
                settleSizing();
              },
              function (e) { log('backstage load error: ' + e); }), true);
          } catch (e) {
            log('backstage would not load: ' + e);
            sliding = false;
            return;
          }

          // Both are loaded and on screen. Start the CSS transition:
          // the stage leaves to the right, backstage enters from the left.
          stageCanvas.classList.add('sliding');
          backCanvas.style.transform = 'translateX(0)';
          log('slide: ' + SLIDE_MS + 'ms');

          await wait(SLIDE_MS + 120);

          // Hand the pointer over and destroy the stage completely.
          unregisterInstance(stageRive);
          stageRive.cleanup();
          stageRive = null;
          if (stageCanvas.parentNode) { stageCanvas.parentNode.removeChild(stageCanvas); }

          backCanvas.classList.add('live');
          backCanvas.style.transform = '';
          // Re-fit now that the off-screen transform is gone.
          fitInstances();
          finished = true;
          sliding = false;
          log('done - backstage is live');
        }

        function stopWatching() {
          // The tick loop bails out on its own once sliding/finished is set;
          // nothing else to tear down.
        }

        window.addEventListener('error', function (ev) {
          showError('Runtime error: ' + (ev.message || ev));
        });

        boot();
      })();
    </script>
  </body>
</html>
