<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap {
    position: absolute; inset: 0; margin: auto; overflow: hidden;
    aspect-ratio: 1200 / 620;
    width: min(100vw, calc(100vh * 1200 / 620));
  }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transition: transform 1.8s cubic-bezier(.65, 0, .35, 1);
  }
  #back { transform: translateX(-100%); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <canvas id="back"></canvas>
</div>

<script src="https://unpkg.com/@rive-app/webgl2"></script>
<script>
  // ---- settings: change these if your names differ -----------------------
  const RIV_FILE       = 'stage.riv';   // the signed build, next to this file
  const STAGE_ARTBOARD = 'Main';
  const STAGE_SM       = 'Game';
  const BACK_ARTBOARD  = 'backstage';
  const BACK_SM        = '';            // leave empty to use its first state machine
  const STAGE_PROP     = 'stage';       // view model number that reaches 4 at the end
  const SOLVED_VALUE   = 4;
  const SWITCH_DELAY_MS = 3000;         // wait for the curtains to close before sliding
  // -------------------------------------------------------------------------

  const stageCanvas = document.getElementById('stage');
  const backCanvas  = document.getElementById('back');
  const layout = new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center });

  let switched = false;

  function sizeCanvas(c, r) {
    const dpr = window.devicePixelRatio || 1;
    c.width  = c.clientWidth * dpr;
    c.height = c.clientHeight * dpr;
    if (r) r.resizeDrawingSurfaceToCanvas();
  }

  sizeCanvas(stageCanvas);
  const stageRive = new rive.Rive({
    src: RIV_FILE,
    canvas: stageCanvas,
    artboard: STAGE_ARTBOARD,
    stateMachines: STAGE_SM,
    autoplay: true,
    autoBind: true,
    layout,
    onLoad: () => {
      stageRive.resizeDrawingSurfaceToCanvas();
      watchStage();
    },
  });

  // Poll the stage property (simple and robust).
  function watchStage() {
    const timer = setInterval(() => {
      if (switched) { clearInterval(timer); return; }
      try {
        const vmi = stageRive.viewModelInstance;
        const prop = vmi && vmi.number(STAGE_PROP);
        if (prop && prop.value >= SOLVED_VALUE) {
          clearInterval(timer);
          setTimeout(goBackstage, SWITCH_DELAY_MS);
        }
      } catch (e) { /* property not ready yet */ }
    }, 200);
  }

  function goBackstage() {
    if (switched) return;
    switched = true;
    stageCanvas.style.pointerEvents = 'none';

    sizeCanvas(backCanvas);
    const backOptions = {
      src: RIV_FILE,
      canvas: backCanvas,
      artboard: BACK_ARTBOARD,
      autoplay: true,
      autoBind: true,
      layout,
      onLoad: () => {
        backRive.resizeDrawingSurfaceToCanvas();
        if (!BACK_SM && backRive.stateMachineNames.length) {
          backRive.play(backRive.stateMachineNames[0]);
        }
        // Slide: stage out to the right, backstage in from the left.
        requestAnimationFrame(() => {
          stageCanvas.style.transform = 'translateX(100%)';
          backCanvas.style.transform  = 'translateX(0)';
        });
      },
    };
    if (BACK_SM) backOptions.stateMachines = BACK_SM;
    const backRive = new rive.Rive(backOptions);

    // When the slide ends, give backstage the clicks and drop the stage.
    backCanvas.addEventListener('transitionend', () => {
      backCanvas.style.pointerEvents = 'auto';
      stageRive.cleanup();
      stageCanvas.remove();
    }, { once: true });
  }

  window.addEventListener('resize', () => {
    sizeCanvas(stageCanvas, stageRive);
  });

  // Test shortcut: open index.html?test to trigger the slide after 1 second.
  if (location.search.includes('test')) setTimeout(goBackstage, 1000);
</script>
</body>
</html>
